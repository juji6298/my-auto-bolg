name: Government Subsidy Auto Bot

on:
  schedule:
    # 매일 한국 시간 오전 9시(UTC 0시) 자동 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼 활성화

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 소스코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: pip install google-generativeai requests

      - name: 봇 실행하기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python bot.py
