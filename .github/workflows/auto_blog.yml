name: Government Subsidy Auto Bot

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write  # 👈 봇이 히스토리 파일을 업데이트할 수 있도록 권한 부여

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 소스코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai requests google-auth google-auth-oauthlib google-api-python-client

      - name: 봇 실행하기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          BLOGGER_ID: ${{ secrets.BLOGGER_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python bot.py

      - name: 업데이트된 발행 기록(history) 깃허브에 자동 저장하기
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_history.txt
          git commit -m "봇 자동 업데이트: 중복 방지 기록 추가" || echo "저장할 새로운 기록이 없습니다."
          git push
